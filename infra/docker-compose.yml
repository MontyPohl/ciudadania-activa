services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ciudadania
      POSTGRES_PASSWORD: ciudadania
      POSTGRES_DB: ciudadania_activa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciudadania"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgis://ciudadania:ciudadania@db:5432/ciudadania_activa
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    command: celery -A config worker -l info
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgis://ciudadania:ciudadania@db:5432/ciudadania_activa
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
