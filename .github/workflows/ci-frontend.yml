name: CI Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

defaults:
  run:
    working-directory: frontend

env:
  NEXT_PUBLIC_API_URL: http://localhost:8000

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Pruebas (Vitest)
        run: npm test

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Build (next build)
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3106
      PLAYWRIGHT_PRODUCTION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Build para Browser E2E
        run: npm run build

      - name: Browser E2E
        run: npm run test:e2e
