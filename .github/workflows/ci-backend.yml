name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

defaults:
  run:
    working-directory: backend

env:
  DJANGO_SECRET_KEY: ci-test-secret-key
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgis://ciudadania:ciudadania@localhost:5432/ciudadania_activa
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      db:
        # Alineado con infra/docker-compose.yml y con el major de Supabase (17). Ver ADR-0003.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ciudadania
          POSTGRES_PASSWORD: ciudadania
          POSTGRES_DB: ciudadania_activa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciudadania"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de sistema (GDAL/GEOS/PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Instalar dependencias Python
        run: pip install -r requirements/test.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Verificar que no faltan migraciones
        run: python manage.py makemigrations --check --no-input

      - name: Migrar sobre base vacía
        run: python manage.py migrate --no-input

      - name: Pruebas del dominio con umbral de cobertura (S14-D02)
        # experiments_app corre en ci-experiments.yml (S14-D03).
        run: >-
          pytest --cov=apps --cov-config=coverage-gate.toml --cov-report=term-missing
          --ignore=apps/experiments_app

      - name: Cobertura HT-5 sobre el manifiesto congelado de S11A (informativo)
        run: coverage report --rcfile=coverage-ht5.toml
