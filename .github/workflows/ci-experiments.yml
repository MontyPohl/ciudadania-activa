name: CI Experiments (S11 / EX-10)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

env:
  DJANGO_SECRET_KEY: ci-test-secret-key
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgis://ciudadania:ciudadania@localhost:5432/ciudadania_activa
  REDIS_URL: redis://localhost:6379/0

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      experiments: ${{ steps.filter.outputs.experiments }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          # El merge checkout contiene el head del PR; historial completo para merge-base.
          fetch-depth: 0
          persist-credentials: false

      - name: Detectar cambios que afectan experiments_app
        id: filter
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Lista conservadora (ver README, CI/CD): exporter/provenance/ex10_state
        # importan admin, auth, reports, rewards, notifications y ai_client;
        # local_storage usa core y ex10_executor usa map. Django carga además
        # analytics/social_ingestion vía settings/URLs y migra todas las apps.
        # backend/** incluye esas apps y migraciones, config, requirements (sin
        # lockfile Python actual), conftest, pyproject/pytest, cobertura, Dockerfiles
        # y scripts s11_*. infra, .env.example, .gitignore y la política S11A
        # conservan la protección de custodia/GOV-T054. Se incluye este workflow
        # y configuración Python raíz, incluso si se incorpora en el futuro.
        # Sin paths en los eventos: changes siempre reporta y experiments queda
        # skipped en PR ajenos. Push a main, manual y un eventual schedule: siempre.
        run: |
          python3 - <<'PYTHON'
          import fnmatch
          import os
          import subprocess

          paths = (
              "backend/**",
              "infra/**",
              ".env.example",
              ".gitignore",
              "docs/tesis/S11A_POLITICA_CUSTODIA_Y_ACCESO.md",
              ".github/workflows/ci-experiments.yml",
              "conftest.py",
              "pytest.ini",
              "pyproject.toml",
              "setup.cfg",
              "tox.ini",
              ".coveragerc",
              "coverage*.toml",
              "requirements*.txt",
              "requirements/**",
              "uv.lock",
              "poetry.lock",
              "Pipfile*",
          )
          relevant = True
          if os.environ["EVENT_NAME"] == "pull_request":
              # Tres puntos: cambios introducidos por el PR desde la base común.
              # NUL y --no-renames cubren nombres especiales, borrados y ambos
              # extremos de un renombre; sin límite de archivos de la API/paths.
              changed = subprocess.check_output([
                  "git", "diff", "--name-only", "-z", "--no-renames",
                  f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}", "--",
              ]).decode("utf-8", errors="surrogateescape").split("\0")
              relevant = any(
                  fnmatch.fnmatchcase(path, pattern)
                  for path in changed if path
                  for pattern in paths
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"experiments={str(relevant).lower()}\n")
          PYTHON

  experiments:
    needs: changes
    if: needs.changes.outputs.experiments == 'true'
    runs-on: ubuntu-24.04

    services:
      db:
        # Alineado con infra/docker-compose.yml y con el major de Supabase (17). Ver ADR-0003.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ciudadania
          POSTGRES_PASSWORD: ciudadania
          POSTGRES_DB: ciudadania_activa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciudadania"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de sistema (GDAL/GEOS/PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Instalar dependencias Python
        run: pip install -r requirements/test.txt

      - name: Pruebas de experiments_app
        # Mismo comando y cobertura que antes del S14: no cambia el comportamiento del aparato.
        # Los launchers EX-10 exceden el límite de 6 h de Actions y no tocan el dominio.
        run: >-
          pytest apps/experiments_app --cov=apps --cov-report=term-missing
          --ignore=apps/experiments_app/tests/test_ex10_official_launcher.py
          --ignore=apps/experiments_app/tests/test_ex10_launcher.py
          --ignore=apps/experiments_app/tests/test_ex10_preflight_launcher.py
